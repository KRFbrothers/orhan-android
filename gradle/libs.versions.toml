# ============================================================================
#  Orhan AI — Gradle Version Catalog
#
#  Every version below was resolved against Google Maven / Maven Central and
#  the Compose BOM POM itself (not from memory). See gradle/README.md for the
#  compatibility reasoning and the exact commands used to verify.
#
#  Chosen stack:
#      AGP 8.7.3  ·  Gradle 8.9  ·  Kotlin 2.0.21  ·  Compose BOM 2024.12.01
#      -> Compose UI/Foundation 1.7.6, Material3 1.3.1
# ============================================================================

[versions]
# --- Build toolchain -------------------------------------------------------
agp = "8.7.3"                       # requires Gradle 8.9+, supports compileSdk 35
kotlin = "2.0.21"                   # K2; compose compiler ships as a Kotlin plugin
ksp = "2.0.21-1.0.28"               # only if you add Room/Hilt-KSP later

# --- SDK levels ------------------------------------------------------------
compileSdk = "35"
minSdk = "26"
targetSdk = "35"

# --- Compose ---------------------------------------------------------------
# The BOM pins every androidx.compose.* artifact, so those libraries carry NO
# version of their own in [libraries]. BOM 2024.12.01 -> Compose 1.7.6,
# Material3 1.3.1, material-icons-extended 1.7.6.
composeBom = "2024.12.01"

# --- AndroidX --------------------------------------------------------------
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"                 # viewmodel-compose + runtime-compose share this
navigation = "2.8.4"
datastore = "1.1.1"

# --- Test ------------------------------------------------------------------
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
coroutinesTest = "1.9.0"

[libraries]
# --- Compose BOM (the platform; apply with `platform(...)`) ----------------
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# --- Compose core (versions come from the BOM) -----------------------------
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- AndroidX core / lifecycle / navigation / datastore --------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Test ------------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[bundles]
# Everything a Compose screen needs at runtime. One line in build.gradle.kts.
# ui-tooling-preview is here (not in compose-debug) because @Preview annotations
# are compiled into the main source set — it must be an `implementation`.
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-foundation",
    "compose-material3",
    "compose-material-icons-extended",
]

# The Appearance/Settings feature: DataStore + ViewModel + navigation.
settings-feature = [
    "androidx-datastore-preferences",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-navigation-compose",
]

# Debug-only tooling. Never shipped in release.
compose-debug = [
    "compose-ui-tooling",
    "compose-ui-test-manifest",
]

# Instrumented UI tests.
compose-test = [
    "compose-ui-test-junit4",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0+: the Compose compiler is a Kotlin plugin, version-locked to Kotlin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
