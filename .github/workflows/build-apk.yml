name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # SECURITY: DUA_DEV_JWT and DUA_APP_TOKEN are local-only (developer local.properties).
      # They must NEVER be written here: these debug APKs are published publicly.
      - name: Write local.properties from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DUA_ENGINE_URL: ${{ secrets.DUA_ENGINE_URL }}
          DUA_API_URL: ${{ secrets.DUA_API_URL }}
        run: |
          # Public engine URLs from docs/BACKEND.md are used only as fallbacks.
          : "${DUA_ENGINE_URL:=https://dua-ai-engine-228305912525.us-central1.run.app}"
          : "${DUA_API_URL:=https://dua-api-228305912525.us-central1.run.app}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets missing - sign-in will not work in this APK."
          fi
          {
            [ -n "$ANDROID_HOME" ] && echo "sdk.dir=$ANDROID_HOME"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "DUA_ENGINE_URL=$DUA_ENGINE_URL"
            echo "DUA_API_URL=$DUA_API_URL"
          } > local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PbuildNumber=${{ github.run_number }}

      - name: Remove local.properties
        if: always()
        run: rm -f local.properties

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Orhan-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Orhan-debug-APK
          path: Orhan-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Release (debug-apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: debug-apk-latest
        run: |
          NOTES="Orhan v0.1.${{ github.run_number }} (versionCode ${{ github.run_number }}) - debug APK from run #${{ github.run_number }} (commit ${{ github.sha }}).

          > **Note:** DUA_APP_TOKEN and DUA_DEV_JWT are excluded from CI builds. Sign in with your Supabase account; the backend authenticates via your user JWT."
          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "${{ github.sha }}"
            git push -f origin "refs/tags/$TAG"
            gh release edit "$TAG" --title "Debug APK v0.1.${{ github.run_number }} (latest)" --notes "$NOTES" --prerelease --latest=false
            gh release upload "$TAG" Orhan-debug.apk --clobber
          else
            gh release create "$TAG" Orhan-debug.apk --target "${{ github.sha }}" \
              --title "Debug APK v0.1.${{ github.run_number }} (latest)" --notes "$NOTES" --prerelease --latest=false
          fi
